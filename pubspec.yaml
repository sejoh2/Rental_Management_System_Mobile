name: caretaker_app
description: "The caretaker app: meter readings, repairs, expenses and tenants for the properties a caretaker looks after."
# Never published to pub.dev.
publish_to: 'none'

# version: what people see (1.0.0) + build number (1), raised for every Play Store upload.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  # The web app's fonts, bundled so they work without a connection.
  # Open Font License: see assets/fonts/OFL-*.txt.
  fonts:
    # Text.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    # Headings and the brand mark.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    # Amounts and readings, with figures of equal width.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600

# The app icon, made from assets/icon by: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#C1440E"
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 24

# The screen shown while the app opens, made by: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1C1712"
  image: assets/icon/splash.png
  android_12:
    color: "#1C1712"
    image: assets/icon/foreground.png
    icon_background_color: "#C1440E"
