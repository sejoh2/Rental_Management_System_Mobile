# Opens pull requests into the test branch when packages have updates or
# security fixes. They go through CI like any other change.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: test
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: test
    schedule:
      interval: monthly
